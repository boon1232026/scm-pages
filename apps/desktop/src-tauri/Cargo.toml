[package]
name = "social-commerce-manager"
version = "0.1.0"
description = "Social Commerce Manager — multi-page Facebook publishing for online shops"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "scm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
